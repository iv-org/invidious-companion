name: Rolling Release Binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel in-progress runs for the same ref to avoid multiple concurrent builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: node24-win-x64
            binary_name: invidious_companion.exe
            archive_name: invidious_companion-x86_64-pc-windows-msvc.zip
            zip: true
          - target: node24-macos-arm64
            binary_name: invidious_companion
            archive_name: invidious_companion-aarch64-apple-darwin.tar.gz
            zip: false
          - target: node24-linux-x64
            binary_name: invidious_companion
            archive_name: invidious_companion-x86_64-unknown-linux-gnu.tar.gz
            zip: false
          - target: node24-linux-arm64
            binary_name: invidious_companion
            archive_name: invidious_companion-aarch64-unknown-linux-gnu.tar.gz
            zip: false

    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        run: |
          printf 'export const VERSION_DATE = "%s";\nexport const VERSION_COMMIT = "%s";\n' \
            "$(git log -1 --format=%ci | awk '{print $1}' | sed s/-/./g)" \
            "$(git rev-list HEAD --max-count=1 --abbrev-commit)" \
            > src/version.ts

      - name: Build binary
        run: |
          npx tsc -p tsconfig.build.json
          npx esbuild src/lib/jobs/worker.ts --bundle --platform=node --format=cjs --packages=external --outfile=build/lib/jobs/worker.cjs
          npx pkg . --targets ${{ matrix.target }}
          mv dist/invidious-companion* ${{ matrix.binary_name }}

      - name: Create archive
        run: |
          if [ "${{ matrix.zip }}" = "true" ]; then
            zip "${{ matrix.archive_name }}" "${{ matrix.binary_name }}"
          else
            tar -czf "${{ matrix.archive_name }}" "${{ matrix.binary_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.archive_name }}
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: ncipollo/release-action@v1
        with:
          tag: release-${{ github.ref_name }}
          removeArtifacts: true
          allowUpdates: true
          artifacts: artifacts/**
          body: |
            Binaries from ${{ github.ref_name }} branch.
